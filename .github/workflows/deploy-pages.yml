name: MOS Project Monitor - GitHub Pages CI/CD

on:
  push:
    branches: [main]
    paths:
      - index.html
      - sw.js
      - manifest.webmanifest
      - apple-touch-icon.png
      - icon-192.png
      - icon-512.png
      - CNAME
      - scripts/validate-pages.mjs
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mos-project-monitor-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate MOS app and offline service worker
        run: |
          node --check sw.js
          node scripts/validate-pages.mjs
      - name: Package only public website files
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest apple-touch-icon.png icon-192.png icon-512.png CNAME _site/
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    name: Publish projects.mysomis.com
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
