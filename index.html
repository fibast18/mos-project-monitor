<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101e33">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MOS Monitor">
  <meta name="app-version" content="1.1.0">
  <title>MOS Project Monitor</title>
  <style>
    :root{color-scheme:light;--navy:#101e33;--navy2:#19314f;--teal:#006f75;--mint:#d9f2ee;--ink:#17263b;--muted:#66768a;--line:#e2e9f0;--bg:#f2f5f9;--white:#fff;--amber:#a56606;--red:#b83240;--green:#15724c;--shadow:0 8px 25px rgba(20,40,70,.055)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.48 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(85px + env(safe-area-inset-bottom))}
    button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}a{color:var(--teal)}
    .top{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding:calc(11px + env(safe-area-inset-top)) 18px 14px;box-shadow:0 3px 18px #07132333}
    .top-row{max-width:1040px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;gap:11px;align-items:center;min-width:0}.logo{width:42px;height:42px;flex:0 0 42px;border-radius:13px;background:#2b8a89;display:grid;place-items:center;font-size:24px}.brand h1{font-size:17px;letter-spacing:.1px;line-height:1.25;margin:0}.brand small{display:block;color:#c4d6e5;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.version{font-size:11px;padding:5px 9px;border:1px solid #50637c;border-radius:20px;color:#dce9f3;white-space:nowrap}
    main{max-width:1040px;margin:auto;padding:20px 16px 24px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:2px 0 18px}.head h2{font-size:24px;line-height:1.2;margin:0 0 5px;font-weight:800;letter-spacing:-.5px}.muted{color:var(--muted)}.small{font-size:12px}.eyebrow{text-transform:uppercase;letter-spacing:1.4px;font-size:10px;font-weight:800;color:var(--teal);margin:0 0 7px}.subtle{color:#d4e3eb;font-size:12px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.panel,.stat,.project-card,.welcome{background:var(--white);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.panel{padding:17px;margin-bottom:14px}.panel h3{font-size:17px;margin:0 0 10px}.panel p{margin:8px 0}.stat{padding:15px;min-height:116px}.stat .val{font-size:25px;font-weight:800;letter-spacing:-.5px;line-height:1.25;margin:7px 0 5px}.stat .stat-label{font-size:12px;color:var(--muted);font-weight:600}.stat .foot{font-size:11px;color:var(--muted)}.stat .val.money{font-size:19px}
    .button{border:1px solid transparent;border-radius:11px;min-height:42px;padding:10px 13px;font-weight:750;background:#eaf0f6;color:var(--ink);display:inline-flex;gap:7px;align-items:center;justify-content:center;text-align:center;text-decoration:none}.button.primary{background:var(--teal);color:#fff}.button.dark{background:var(--navy);color:#fff}.button.ghost{border-color:var(--line);background:#fff}.button.danger{color:var(--red);background:#fff1f2}.button.tiny{min-height:34px;padding:6px 9px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .button{flex:0 0 auto}.wide{width:100%}.rounded{border-radius:100px}
    .notice{padding:13px 14px;border:1px solid #bcdad9;background:#eaf8f7;color:#165a62;border-radius:13px;font-size:13px;margin-bottom:14px}.notice.warn{border-color:#edd5a9;background:#fff8e9;color:#805914}.welcome{padding:23px;margin-bottom:15px;background:linear-gradient(120deg,var(--navy),#20565f);color:white}.welcome h2{font-size:22px;margin:0 0 6px}.welcome p{color:#d9ebef;font-size:13px}.welcome .button{background:#fff;color:var(--navy)}
    .flex{display:flex;gap:12px;align-items:center}.between{justify-content:space-between}.grow{flex:1;min-width:0}.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);color:#53647b;border-radius:100px;padding:4px 9px;font-weight:750;font-size:10px;letter-spacing:.1px;background:#f6f8fa;white-space:nowrap}.chip.Construction{color:#075f74;background:#e4f5f9;border-color:#b8e1e8}.chip.Completed{color:#15613f;background:#e6f5eb;border-color:#c6e9d2}.chip.On-Hold,.chip.Awaiting-Funding{color:#975f07;background:#fff4de;border-color:#f2d9a1}.chip.Cancelled{color:#a42d3e;background:#fff0f1;border-color:#f2cbd0}
    .bar{height:8px;background:#e8eef4;border-radius:20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#00737b,#24a58e);border-radius:20px;transition:width .2s}.fill.amber{background:#d19d37}.project-card{padding:16px;display:block;width:100%;color:var(--ink);text-align:left;border-color:var(--line);background:white}.project-card:active{transform:scale(.995)}.project-card h3{font-size:16px;margin:0 0 4px;line-height:1.3}.project-card .p-meta{font-size:12px;color:var(--muted);margin:8px 0}.project-card .bar{margin:8px 0}.project-card .bottomline{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px}.percent{font-weight:800;font-variant-numeric:tabular-nums}.list{display:grid;gap:10px}
    .filter{width:100%;background:white;border:1px solid var(--line);border-radius:12px;padding:12px 13px;min-height:45px;outline-color:var(--teal)}.filters{display:grid;grid-template-columns:1fr;gap:10px;margin:0 0 14px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}.section-title h3{font-size:16px;margin:0}.empty{border:1px dashed #bed0dc;border-radius:14px;padding:24px;text-align:center;background:#fbfcfe;color:var(--muted)}.empty h3{margin:0 0 6px;color:var(--ink)}
    .detail-name{font-size:22px;line-height:1.25;margin:0 0 8px}.mini-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 12px}.mini-tabs button{white-space:nowrap;border:1px solid var(--line);border-radius:100px;padding:9px 14px;background:white;color:var(--muted);font-weight:750}.mini-tabs button.active{background:var(--navy);border-color:var(--navy);color:white}.definition{display:grid;grid-template-columns:38% 62%;row-gap:12px}.definition dt{font-size:12px;color:var(--muted)}.definition dd{margin:0;font-size:13px;overflow-wrap:anywhere;font-weight:650}.progress-line{display:flex;align-items:center;justify-content:space-between;margin:8px 0}.progress-line b{font-size:20px}.progress-note{color:var(--muted);font-size:12px;line-height:1.5}
    .activity{padding:14px 0;border-bottom:1px solid var(--line)}.activity:last-child{border-bottom:none}.activity h4{margin:0 0 2px;font-size:14px}.activity .numbers{font-size:13px;font-weight:650;white-space:nowrap}.activity-top{display:flex;justify-content:space-between;gap:10px}.activity .bar{margin:9px 0}.timeline{position:relative;padding:2px 0 0 15px;border-left:2px solid #d7e5e9;margin-left:7px}.timeline-entry{position:relative;padding:0 0 20px 14px}.timeline-entry:before{content:"";position:absolute;left:-21px;top:6px;height:10px;width:10px;border-radius:50%;background:var(--teal);border:2px solid #fff;box-shadow:0 0 0 1px #cfe3e6}.timeline-entry h4{margin:0 0 6px;font-size:13px}.timeline-entry p{white-space:pre-wrap;font-size:13px;margin:4px 0 9px;overflow-wrap:anywhere}.timeline-entry .actions{gap:5px}
    .doc{display:flex;gap:11px;justify-content:space-between;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}.doc:last-child{border:0}.doc-title{font-weight:750;overflow-wrap:anywhere;font-size:13px}.file-icon{height:39px;width:39px;border-radius:10px;background:#e9f3f4;display:grid;place-items:center;font-size:19px;flex-shrink:0}.doc-main{flex:1;min-width:0}
    .nav{position:fixed;bottom:0;left:0;right:0;z-index:32;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 22px #16324a14}.nav button{border:0;background:none;color:#77889b;min-height:51px;padding:3px 4px;display:grid;align-content:center;justify-items:center;gap:0;font-size:10px;font-weight:750}.nav button .ico{font-size:22px;line-height:1.3}.nav button.active{color:var(--teal)}
    .modal-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:#0b1a30a8;padding-top:env(safe-area-inset-top)}.modal{width:100%;max-width:610px;max-height:95dvh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:19px 18px calc(24px + env(safe-area-inset-bottom))}.modal h2{font-size:21px;margin:0 0 4px}.modal .modal-actions{display:flex;gap:9px;position:sticky;bottom:-1px;padding-top:13px;background:#fff}.modal .modal-actions button{flex:1}.field{margin:12px 0}.field label{display:block;font-weight:700;font-size:12px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;min-height:43px;padding:10px 11px;border:1px solid #cbd7e1;border-radius:10px;background:#fff;color:var(--ink);outline-color:var(--teal)}.field textarea{min-height:110px;resize:vertical}.field small{color:var(--muted)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.field.full{grid-column:1/-1}.kbd{font-variant-numeric:tabular-nums}.caps{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:800}
    .check{display:flex;gap:9px;align-items:flex-start;font-size:13px;margin:10px 0}.check input{margin-top:4px;accent-color:var(--teal)}.footer{text-align:center;color:#8491a3;font-size:11px;margin:32px 0 0}.separator{height:1px;background:var(--line);margin:15px 0}.top-projects{display:grid;gap:10px}.progress-stat{background:#f6f9fb;border:1px solid var(--line);border-radius:12px;padding:12px}.helper{font-size:12px;color:var(--muted)}

    /* v1.1.0: Read-only local AI analytics and actionable project screening. */
    .ai-stats{margin-bottom:14px}.ai-stats .stat{min-width:0}.ai-stats .val{overflow-wrap:anywhere}
    .ai-tabs{margin-bottom:4px}.ai-tabs button{flex:1}.ai-filter{margin-bottom:12px}.ai-filter select{margin-top:6px}
    .ai-coverage{margin:13px 0 19px}.ai-coverage .flex{font-size:13px;gap:10px}.ai-coverage .bar{margin:7px 0 4px}.ai-coverage:last-of-type{margin-bottom:4px}
    .ai-moneyline{display:grid;gap:13px;grid-template-columns:1fr 1fr;margin-bottom:12px}.ai-moneyline b{font-size:17px;overflow-wrap:anywhere;display:block}
    .ai-stage-list{display:grid;gap:14px}.ai-stage .bar{margin-top:6px}
    .ai-scroll{overflow-x:auto;max-width:100%;margin-top:3px}.ai-table{width:100%;border-collapse:collapse;min-width:540px;font-size:12px;text-align:left}.ai-table th{background:#f5f8fb;color:var(--muted);font-size:11px}.ai-table th,.ai-table td{padding:11px 9px;border-bottom:1px solid var(--line);vertical-align:top}.ai-project-link{background:none;border:0;padding:0;font-weight:750;color:#006f75;text-align:left;text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}
    .ai-alert-count{display:inline-block;background:#fff1e8;color:#943c0d;padding:1px 7px;border-radius:7px}.ai-findings-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 12px}.ai-findings-controls label{display:block;margin-bottom:5px}
    .ai-tag{font-size:10px;border-radius:30px;font-weight:800;padding:5px 10px;border:1px solid transparent}.ai-tag.critical{background:#feebee;border-color:#f6c4cc;color:#af2338}.ai-tag.high{background:#fff2e2;border-color:#f4d4aa;color:#8d5200}.ai-tag.watch{background:#e7f4ff;border-color:#cbdff0;color:#235887}.ai-tag.info{background:#f0f3f7;border-color:#e0e5ee;color:#53647b}
    .ai-issue{border-left:4px solid #a8c5cb}.ai-issue:has(.ai-tag.critical){border-left-color:#c73b50}.ai-issue:has(.ai-tag.high){border-left-color:#b37717}.ai-issue .ai-evidence,.ai-issue .ai-advice{margin:13px 0}.ai-issue .ai-evidence p,.ai-issue .ai-advice p{font-size:13px;margin:3px 0;overflow-wrap:anywhere}.ai-issue .actions{margin-top:14px}
    @media(max-width:390px){.nav button{font-size:9px}.nav button .ico{font-size:20px}.ai-moneyline{grid-template-columns:1fr}.ai-stats .val{font-size:21px}}
    @media(min-width:700px){body{padding-bottom:70px}.top{padding-top:14px}.nav{left:50%;transform:translateX(-50%);bottom:12px;max-width:480px;border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:0 9px 35px #101e3326}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:1fr 210px}.modal-wrap{align-items:center;padding:20px}.modal{max-height:90vh;border-radius:22px}}
    @media(max-width:375px){.head h2{font-size:21px}.stat .val{font-size:22px}.brand h1{font-size:15px}.form-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="top"><div class="top-row"><div class="brand"><div class="logo" aria-hidden="true">🏗️</div><div><h1>Metro Ormoc Slaughterhouse</h1><small>Project Monitoring • Local-first 201 Files</small></div></div><span class="version">v1.1.0</span></div></header>
  <main id="app"></main>
  <nav class="nav" id="nav" aria-label="Main navigation"></nav>
  <input type="file" id="csvFileInput" accept=".csv,text/csv,text/plain" hidden>
  <input type="file" id="restoreInput" accept=".json,application/json" hidden>
  <input type="file" id="documentInput" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv" multiple hidden>
  <div id="modalMount"></div>
  <script>
  'use strict';
  // All private project data is saved on this device, never in GitHub or a remote database.
  const VERSION='1.1.0', DATA_KEY='mos-project-monitor-v1', DB_NAME='mos-project-documents-v1';
  const STATUSES=['Needs Review','Planning','Procurement','Awaiting Funding','Construction','On Hold','Completed','Cancelled'];
  const PRIORITIES=['Normal','High','Critical'];
  const app=document.getElementById('app'), nav=document.getElementById('nav');
  const view={page:'dashboard',pid:null,detailTab:'overview',query:'',statusFilter:'All',updatesFilter:'All',aiTab:'analyst',aiScope:'All',aiSeverity:'All',aiCategory:'All'};
  let data=loadData(); let dbPromise=null; let modalUrl=null;

  function blankData(){return {schemaVersion:1,projects:[],updates:[],activities:[],savedAt:new Date().toISOString()};}
  function loadData(){try{let raw=localStorage.getItem(DATA_KEY);let obj=raw?JSON.parse(raw):blankData();if(!Array.isArray(obj.projects)||!Array.isArray(obj.updates)||!Array.isArray(obj.activities))throw Error('Invalid saved data');return obj;}catch(err){alert('Unable to load saved data: '+err.message+'\nPlease restore a backup if needed.');return blankData();}}
  function save(){data.savedAt=new Date().toISOString();try{localStorage.setItem(DATA_KEY,JSON.stringify(data));}catch(err){alert('The iPhone could not save your changes. Export a backup and free device storage. '+err.message);throw err;}}
  function id(){return (typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);}
  function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function money(n){let x=Number(n);return Number.isFinite(x)?new Intl.NumberFormat('en-PH',{style:'currency',currency:'PHP',maximumFractionDigits:2}).format(x):'—';}
  function moneyShort(n){let x=Number(n);if(!Number.isFinite(x))return '—';return '₱'+(x>=1e6?(x/1e6).toLocaleString('en-PH',{maximumFractionDigits:2})+'M':x>=1e3?(x/1e3).toLocaleString('en-PH',{maximumFractionDigits:1})+'K':x.toLocaleString('en-PH',{maximumFractionDigits:0}));}
  function num(x){return Number(x||0).toLocaleString('en-PH',{maximumFractionDigits:2});}
  function today(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
  function displayDate(iso){if(!iso)return 'Not set';let d=new Date(iso+'T12:00:00');return isNaN(d)?iso:d.toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric'});}
  function monthDate(iso){if(!iso)return '';return new Date(iso+'T12:00:00').toLocaleDateString('en-PH',{month:'long',year:'numeric'});}
  function asAmount(v){if(String(v).trim()==='')return null;let n=Number(v);return Number.isFinite(n)&&n>=0?n:null;}
  function percent(x){return Math.round(Math.min(100,Math.max(0,x)))}
  function project(pid){return data.projects.find(p=>p.id===pid)}
  function projectActivities(pid){return data.activities.filter(a=>a.projectId===pid)}
  function projectUpdates(pid){return data.updates.filter(u=>u.projectId===pid).sort((a,b)=>b.date.localeCompare(a.date)||String(b.createdAt||'').localeCompare(String(a.createdAt||'')));}
  function physical(pid){let all=projectActivities(pid).filter(a=>Number(a.target)>0&&Number(a.weight)>0);if(!all.length)return null;let w=all.reduce((s,a)=>s+Number(a.weight),0);return w>0?all.reduce((s,a)=>s+Number(a.weight)*Math.min(1,Math.max(0,Number(a.actual||0)/Number(a.target))),0)/w*100:null;}
  function financial(p){return p?.approvedBudget>0&&p?.amountSpent!=null?Number(p.amountSpent)/Number(p.approvedBudget)*100:null;}
  function elapsed(p){if(!p?.startDate||!p?.targetDate)return null;let start=new Date(p.startDate+'T12:00:00'),end=new Date(p.targetDate+'T12:00:00');if(!(end>start))return null;return ((new Date()-start)/(end-start))*100;}
  function overdue(p){if(!p?.targetDate||['Completed','Cancelled'].includes(p.status))return 0;let target=new Date(p.targetDate+'T23:59:59');return Math.max(0,Math.floor((new Date()-target)/86400000));}
  function stageClass(status){return String(status||'').replace(/\s+/g,'-');}
  function progressMarkup(v){return `<div class="bar"><div class="fill" style="width:${v===null?0:percent(v)}%"></div></div>`;}
  function statusChip(p){return `<span class="chip ${esc(stageClass(p.status))}">${esc(p.status||'Needs Review')}${p.statusSuggested?' · suggested':''}</span>`;}
  function heading(title,subtitle,action=''){return `<div class="head"><div><h2>${esc(title)}</h2><div class="muted small">${esc(subtitle)}</div></div>${action}</div>`;}
  function footer(){return `<div class="footer">MOS Project Monitor v${VERSION} · Stored on this device<br>City Government of Ormoc · Project 201 Records</div>`;}
  function renderNav(){nav.innerHTML=[['dashboard','◫','Dashboard'],['projects','▤','Projects'],['updates','◷','Updates'],['ai','✦','AI Center'],['backup','⇩','Backup']].map(([page,ico,label])=>`<button data-action="navigate" data-page="${page}" class="${view.page===page||(view.page==='detail'&&page==='projects')?'active':''}" aria-label="${label}"><span class="ico">${ico}</span>${label}</button>`).join('');}
  function render(){renderNav();if(view.page==='dashboard')app.innerHTML=dashboard();else if(view.page==='projects')app.innerHTML=projectsPage();else if(view.page==='updates')app.innerHTML=updatesPage();else if(view.page==='backup')app.innerHTML=backupPage();else if(view.page==='ai')app.innerHTML=aiCenterPage();else app.innerHTML=detailPage();if(view.page==='detail'&&view.detailTab==='files')refreshDocs();if(view.page==='backup')storageInfo();}
  function go(page,pid){view.page=page;if(pid)view.pid=pid;window.scrollTo(0,0);render();}

  function dashboard(){let total=data.projects.length;let assessed=data.projects.map(p=>physical(p.id)).filter(v=>v!==null);let avg=assessed.length?assessed.reduce((s,x)=>s+x,0)/assessed.length:null;let budget=data.projects.reduce((s,p)=>s+(Number(p.approvedBudget)||0),0);let attention=data.projects.filter(p=>['Awaiting Funding','On Hold'].includes(p.status)||overdue(p)>0).length;let flagged=data.projects.filter(p=>['Awaiting Funding','On Hold'].includes(p.status)||overdue(p)>0).slice(0,5);let recent=[...data.updates].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
    return `${!total?`<section class="welcome"><div class="eyebrow" style="color:#a9eeea">Welcome</div><h2>Your project records, in one place.</h2><p>Import your existing monitoring CSV privately on this iPhone, or create a project. The GitHub website itself stores none of your private records.</p><div class="actions"><button class="button" data-action="choose-csv">Import Project Monitoring.csv</button><button class="button" data-action="new-project">+ New project</button></div></section>`:''}
    ${heading('Project overview','Live figures based on records saved on this iPhone',`<button class="button tiny primary" data-action="new-update">+ Update</button>`)}
    <div class="grid"><div class="stat"><div class="stat-label">Total projects</div><div class="val">${total}</div><div class="foot">Registered project files</div></div><div class="stat"><div class="stat-label">Physical progress</div><div class="val">${avg===null?'—':percent(avg)+'%'}</div><div class="foot">${assessed.length}/${total} measured · average</div></div><div class="stat"><div class="stat-label">Approved budgets</div><div class="val money">${moneyShort(budget)}</div><div class="foot">Recorded approved costs only</div></div><div class="stat"><div class="stat-label">Needs attention</div><div class="val">${attention}</div><div class="foot">Funding, on hold or overdue</div></div></div>
    ${!assessed.length&&total?`<div class="notice warn" style="margin-top:14px">Percentages are intentionally blank until you add measurable work items (target, actual quantity and weight). Written updates alone cannot establish physical completion.</div>`:''}
    <div class="section-title"><h3>Projects at a glance</h3><button class="button tiny ghost" data-action="navigate" data-page="projects">View all</button></div>
    ${total?`<div class="grid cards">${data.projects.slice(0,8).map(projectCard).join('')}</div>`:`<div class="empty">No projects yet. Import the CSV to initialize your project 201 files.</div>`}

  function projectCard(p){let v=physical(p.id),last=projectUpdates(p.id)[0];return `<button class="project-card" data-action="detail" data-id="${p.id}"><div class="flex between" style="align-items:flex-start"><div class="grow"><h3>${esc(p.title)}</h3><span class="small muted">📍 ${esc(p.location||'Location not set')}</span></div><span style="font-size:19px;color:#8494a6">›</span></div><div class="p-meta">${statusChip(p)}</div><div class="bottomline"><span>Physical accomplishment</span><span class="percent">${v===null?'Not measured':percent(v)+'%'}</span></div>${progressMarkup(v)}<div class="bottomline muted"><span>${p.approvedBudget!=null?moneyShort(p.approvedBudget):'Budget not set'}</span><span>${last?esc(last.period||displayDate(last.date)):'No updates'}</span></div></button>`;}
  function projectsPage(){let count=data.projects.length;return `${heading('Project registry',`${count} project 201 file${count===1?'':'s'}`,`<button class="button tiny primary" data-action="new-project">+ Project</button>`)}<div class="filters"><input class="filter" id="projectSearch" type="search" placeholder="Search title, location, office…" value="${esc(view.query)}" aria-label="Search projects"><select class="filter" id="projectStatusFilter" aria-label="Filter by status"><option>All</option>${STATUSES.map(s=>`<option ${view.statusFilter===s?'selected':''}>${s}</option>`).join('')}</select></div><div id="projectList">${projectsList()}</div>${footer()}`;}

  function updatesPage(){let matches=data.updates.filter(u=>view.updatesFilter==='All'||u.projectId===view.updatesFilter).sort((a,b)=>b.date.localeCompare(a.date)||String(b.createdAt||'').localeCompare(String(a.createdAt||'')));return `${heading('Progress journal','Monthly reports, dated field notes and follow-ups',`<button class="button tiny primary" data-action="new-update">+ Update</button>`)}<select class="filter" id="updatesProjectFilter" style="margin-bottom:15px" aria-label="Filter updates by project"><option value="All">All projects</option>${data.projects.map(p=>`<option value="${p.id}" ${view.updatesFilter===p.id?'selected':''}>${esc(p.title)}</option>`).join('')}</select>${matches.length?`<div class="panel"><div class="timeline">${matches.map(u=>timelineEntry(u,true)).join('')}</div></div>`:`<div class="empty">No status reports recorded yet.</div>`}${footer()}`;}
  function timelineEntry(u,showProject=false){return `<div class="timeline-entry"><h4>${esc(u.period||displayDate(u.date))}${showProject?` · ${esc(project(u.projectId)?.title||'Unknown project')}`:''}</h4><div class="flex" style="flex-wrap:wrap;gap:6px"><span class="chip">${esc(u.source==='csv'?'Imported CSV':'Field update')}</span>${u.stage?`<span class="chip">${esc(u.stage)}</span>`:''}</div><p>${esc(u.note)}</p>${u.nextAction?`<div class="small"><b>Next action:</b> ${esc(u.nextAction)}</div>`:''}${u.responsible?`<div class="small muted">Person responsible: ${esc(u.responsible)}</div>`:''}<div class="actions" style="margin-top:8px"><button class="button tiny ghost" data-action="edit-update" data-id="${u.id}">Edit</button><button class="button tiny ghost" data-action="delete-update" data-id="${u.id}">Delete</button></div></div>`;}
  function detailPage(){let p=project(view.pid);if(!p){view.page='projects';return projectsPage()}let v=physical(p.id),f=financial(p),e=elapsed(p),last=projectUpdates(p.id)[0],over=overdue(p);
    let content='';if(view.detailTab==='overview')content=`<div class="grid two"><div class="progress-stat"><div class="small muted">Physical progress</div><div class="stat val" style="border:0;background:none;box-shadow:none;padding:3px 0;min-height:0">${v===null?'—':percent(v)+'%'}</div>${progressMarkup(v)}</div><div class="progress-stat"><div class="small muted">Financial utilization</div><div class="stat val" style="border:0;background:none;box-shadow:none;padding:3px 0;min-height:0">${f===null?'—':Math.round(f)+'%'}</div>${progressMarkup(f)}</div></div>
    <div class="panel" style="margin-top:14px"><div class="flex between"><h3>Project 201 Profile</h3><button class="button tiny ghost" data-action="edit-project" data-id="${p.id}">Edit</button></div><dl class="definition">${[['Project title',p.title],['Location',p.location],['Status',p.status],['Priority',p.priority],['Implementing office',p.implementingOffice],['End-user',p.endUser],['Funding source',p.fundingSource],['Contractor',p.contractor],['Approved project cost',p.approvedBudget!=null?money(p.approvedBudget):null],['Amount disbursed/paid',p.amountSpent!=null?money(p.amountSpent):null],['Contract duration',p.durationDays?p.durationDays+' calendar days':null],['Start date',p.startDate?displayDate(p.startDate):null],['Target completion',p.targetDate?displayDate(p.targetDate):null],['Office/person in charge',p.focalPerson],['Reference/contract no.',p.referenceNo]].map(([k,val])=>`<dt>${esc(k)}</dt><dd>${esc(val??'—')}</dd>`).join('')}</dl>${p.remarks?`<div class="separator"></div><div class="caps">Background / remarks</div><p style="white-space:pre-wrap">${esc(p.remarks)}</p>`:''}</div>
    <div class="panel"><h3>Schedule interpretation</h3>${e===null?`<p class="helper">Enter the project start and target completion dates to calculate elapsed contract time. This is not physical progress.</p>`:`<div class="progress-line"><span class="small muted">Time elapsed</span><b>${Math.max(0,Math.round(e))}%</b></div>${progressMarkup(e)}<p class="helper">${over>0?`${over} day(s) past target date. `:''}Time elapsed and construction accomplished are different measurements.</p>`}</div>
    <div class="panel"><h3>Latest status report</h3>${last?`<div class="small muted">${esc(last.period||displayDate(last.date))}</div><p style="white-space:pre-wrap">${esc(last.note)}</p>`:`<p class="muted">No updates yet.</p>`}<button class="button primary" data-action="new-update" data-id="${p.id}">+ Record update</button></div>`;
    if(view.detailTab==='progress')content=`<div class="panel"><div class="flex between"><h3>Quantified work items</h3><button class="button tiny primary" data-action="new-activity" data-id="${p.id}">+ Add item</button></div><p class="progress-note">Define measured work packages such as flooring (m²), installed pipe (m), equipment (units), or milestone (1 complete / 0 incomplete). Physical completion = sum of weight × (actual ÷ target), divided by total weights. Each item caps at 100%.</p>${v!==null?`<div class="progress-line"><b>${percent(v)}% overall</b><span class="small muted">${projectActivities(p.id).length} work item(s)</span></div>${progressMarkup(v)}`:''}${projectActivities(p.id).length?projectActivities(p.id).map(a=>activityEntry(a)).join(''):`<div class="empty"><h3>No measured items yet</h3><p>Add a work item before reporting a physical completion percentage.</p></div>`}</div><div class="panel"><h3>Budget and disbursement</h3><div class="progress-line"><span>Approved cost</span><b style="font-size:16px">${p.approvedBudget!=null?money(p.approvedBudget):'—'}</b></div><div class="progress-line"><span>Recorded paid/disbursed</span><b style="font-size:16px">${p.amountSpent!=null?money(p.amountSpent):'—'}</b></div><div class="progress-line"><span>Utilization</span><b>${f===null?'—':Math.round(f)+'%'}</b></div>${progressMarkup(f)}<p class="helper">Disbursement ÷ approved cost. This is NOT the contractor's physical accomplishment or obligation rate.</p><button class="button ghost" data-action="edit-project" data-id="${p.id}">Edit financial fields</button></div>`;

    if(view.detailTab==='files')content=`<div class="notice">Attached files stay in this device's browser storage, not on GitHub. Include them when exporting your JSON backup. An external URL is only a reference, not a stored copy.</div><div class="panel"><div class="flex between"><h3>Project file cabinet</h3><button class="button tiny primary" data-action="attach-file" data-id="${p.id}">+ Attach</button></div><div class="actions"><button class="button tiny ghost" data-action="new-link" data-id="${p.id}">+ Document link</button></div><div id="documentList" class="list" style="margin-top:12px"><p class="helper">Opening local files…</p></div></div>`;
    return `<button class="button tiny ghost" data-action="navigate" data-page="projects" style="margin-bottom:14px">‹ All projects</button><div class="head"><div class="grow"><div class="eyebrow">Project 201 Record</div><h2 class="detail-name">${esc(p.title)}</h2><div class="flex" style="flex-wrap:wrap;gap:7px">${statusChip(p)}<span class="small muted">📍 ${esc(p.location||'Location not set')}</span></div></div></div><div class="actions" style="margin-bottom:12px"><button class="button tiny primary" data-action="new-update" data-id="${p.id}">+ Status update</button><button class="button tiny ghost" data-action="export-dossier" data-id="${p.id}">Export 201</button><button class="button tiny ghost" data-action="ai-project" data-id="${p.id}">AI review</button><button class="button tiny ghost" data-action="edit-project" data-id="${p.id}">Edit profile</button><button class="button tiny danger" data-action="delete-project" data-id="${p.id}">Delete project</button></div><div class="mini-tabs">${[['overview','Overview'],['progress','Quantities'],['journal','Timeline'],['files','Documents']].map(([key,label])=>`<button class="${view.detailTab===key?'active':''}" data-action="detail-tab" data-tab="${key}">${label}</button>`).join('')}</div>${content}${footer()}`;}
  function activityEntry(a){let pct=Number(a.target)>0?percent(Number(a.actual||0)/Number(a.target)*100):0;return `<div class="activity"><div class="activity-top"><div class="grow"><h4>${esc(a.name)}</h4><div class="small muted">Weight: ${num(a.weight)} · ${esc(a.notes||'')}</div></div><div class="numbers">${num(a.actual)} / ${num(a.target)} ${esc(a.unit||'units')}</div></div>${progressMarkup(pct)}<div class="flex between"><div class="small muted">${pct}% item completion</div><div class="actions"><button class="button tiny ghost" data-action="edit-activity" data-id="${a.id}">Edit quantity</button><button class="button tiny danger" data-action="delete-activity" data-id="${a.id}">×</button></div></div></div>`;}
  function backupPage(){return `${heading('Local data & backup','Manage imports, exports and iPhone storage')}<div class="notice warn"><b>Local-only means device-specific.</b> GitHub stores the app code, not your saved project data. Safari and an Add-to-Home-Screen app may use separate storage. Clearing website data, changing devices, or reinstalling the web app may delete your records. Export a backup after significant edits.</div><div class="panel"><h3>Import your monitoring CSV</h3><p class="helper">Supports your existing <b>Project Monitoring.csv</b> layout: project titles across columns, project information in rows, and monthly updates with continuation lines. Existing records are merged by project title.</p><label class="check"><input type="checkbox" id="replaceImported"><span>Replace matching monthly entries previously imported from CSV (does not replace manually added updates)</span></label><button class="button primary wide" data-action="choose-csv">Import CSV file</button></div><div class="panel"><h3>Complete JSON backup</h3><p class="helper">Export all project profiles, work quantities, updates, and the actual contents of locally attached documents. Save in Files, iCloud Drive, or another location you control.</p><button class="button dark wide" data-action="export-backup">Export full backup (.json)</button><div class="separator"></div><p class="helper">Restoring replaces this device's current records. Make a backup before restoring.</p><button class="button ghost wide" data-action="choose-restore">Restore JSON backup</button></div><div class="panel"><h3>Other export options</h3><div class="actions"><button class="button ghost" data-action="export-summary">Export project summary CSV</button><button class="button ghost" data-action="new-project">+ New project</button></div></div><div class="panel"><h3>Built-in AI Center</h3><p class="helper">AI Analyst and AI Advisor run on this device with transparent rules. They require no API key, cloud model, subscription, or internet connection once the app has loaded. AI only reads project records and suggests follow-ups; it never modifies data.</p><button class="button ghost wide" data-action="navigate" data-page="ai">Open AI Center</button></div><div class="panel"><h3>Storage and privacy</h3><div class="small" id="storageInfo">Checking local storage…</div><div class="separator"></div><p class="helper">Your project records are saved with browser localStorage; attached files use IndexedDB. The app contains no analytics, tracking SDKs, user accounts, or automatic uploads.</p><p class="helper">The single HTML file needs internet access to load from GitHub Pages unless the browser happens to cache it. It does not promise offline loading.</p><button class="button danger" data-action="erase-all">Delete all local project data</button></div>${footer()}`;}

  function modalOpen(html){modalClose();document.getElementById('modalMount').innerHTML=`<div class="modal-wrap" role="presentation"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;document.body.style.overflow='hidden';setTimeout(()=>document.querySelector('.modal [autofocus]')?.focus(),0);}
  function modalClose(){if(modalUrl){URL.revokeObjectURL(modalUrl);modalUrl=null}document.getElementById('modalMount').innerHTML='';document.body.style.overflow='';}
  function modalFrame(title,formType,body,submitLabel='Save'){return `<form data-form="${formType}"><h2>${esc(title)}</h2><p class="helper">Changes are stored only on this device.</p>${body}<div class="modal-actions"><button type="button" class="button ghost" data-action="close-modal">Cancel</button><button type="submit" class="button primary">${esc(submitLabel)}</button></div></form>`;}
  function field(name,label,value='',type='text',additional=''){return `<div class="field"><label for="f-${name}">${esc(label)}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value??'')}" ${additional}></div>`;}
  function selectField(name,label,choices,value){return `<div class="field"><label>${esc(label)}</label><select name="${name}">${choices.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`;}
  function textArea(name,label,value=''){return `<div class="field full"><label>${esc(label)}</label><textarea name="${name}">${esc(value)}</textarea></div>`;}
  function projectModal(pid){let p=project(pid)||{};modalOpen(modalFrame(pid?'Edit project 201 profile':'New project 201 file','project',`<input type="hidden" name="id" value="${esc(pid||'')}"><div class="form-grid"><div class="field full">${field('title','Project title *',p.title||'', 'text','required autofocus')}</div>${field('location','Project location',p.location||'')}${field('implementingOffice','Implementing office',p.implementingOffice||'')}${field('endUser','End-user',p.endUser||'MOS')}${field('fundingSource','Funding source',p.fundingSource||'')}${field('contractor','Contractor',p.contractor||'')}${field('focalPerson','Office / person responsible',p.focalPerson||'')}${field('referenceNo','Reference / contract no.',p.referenceNo||'')}${selectField('status','Current stage',STATUSES,p.status||'Needs Review')}${selectField('priority','Priority',PRIORITIES,p.priority||'Normal')}${field('approvedBudget','Approved project cost (PHP)',p.approvedBudget??'','number','min="0" step="0.01" inputmode="decimal"')}${field('amountSpent','Amount paid / disbursed (PHP)',p.amountSpent??'','number','min="0" step="0.01" inputmode="decimal"')}${field('durationDays','Contract duration (calendar days)',p.durationDays??'','number','min="0" step="1" inputmode="numeric"')}${field('startDate','Actual contract start date',p.startDate||'','date')}${field('targetDate','Target completion date',p.targetDate||'','date')}${textArea('remarks','Project background / remarks',p.remarks||'')}</div>`));}
  function updateModal(uid,pid){let u=data.updates.find(x=>x.id===uid)||{};let p=project(pid||u.projectId);let opts=data.projects.map(x=>`<option value="${x.id}" ${x.id===(p?.id)?'selected':''}>${esc(x.title)}</option>`).join('');if(!opts){alert('Create or import a project first.');return}modalOpen(modalFrame(uid?'Edit status report':'Record project update','update',`<input type="hidden" name="id" value="${esc(uid||'')}"><div class="field"><label>Project *</label><select name="projectId" required>${opts}</select></div><div class="form-grid">${field('date','Date *',u.date||today(),'date','required')}${selectField('stage','Stage at update',STATUSES,u.stage||p?.status||'Needs Review')}</div>${textArea('note','Actual progress / issue / status *',u.note||'')} ${textArea('nextAction','Next action / required decision',u.nextAction||'')}${field('responsible','Person responsible / follow-up',u.responsible||'')}`, 'Save report'));}
  function activityModal(aid,pid){let a=data.activities.find(x=>x.id===aid)||{}, p=project(pid||a.projectId);if(!p)return;modalOpen(modalFrame(aid?'Edit measurable item':'New measurable work item','activity',`<input type="hidden" name="id" value="${esc(aid||'')}"><input type="hidden" name="projectId" value="${esc(p.id)}">${field('name','Activity / work package *',a.name||'','text','required autofocus')}<div class="form-grid">${field('target','Planned target *',a.target??'','number','step="any" min="0.000001" required inputmode="decimal"')}${field('actual','Actual quantity completed',a.actual??0,'number','step="any" min="0" required inputmode="decimal"')}${field('unit','Unit (m², m³, sets, milestone)',a.unit||'units')}${field('weight','Progress weight *',a.weight??10,'number','step="any" min="0.000001" required inputmode="decimal"')}</div>${textArea('notes','Remarks / measurement basis',a.notes||'')}<p class="helper">Weights are relative values (e.g., 20, 30, 50). The app normalizes them automatically to 100%; targets must be greater than zero.</p>`));}
  function urlModal(pid){modalOpen(modalFrame('Add reference document','link',`<input type="hidden" name="projectId" value="${esc(pid)}">${field('name','Document title *','','text','required autofocus')}${field('url','HTTPS document link *','','url','required placeholder="https://…"')}${selectField('category','Category',['POW / DED','Contract / NTP','Inspection / Report','Photos','Others'],'POW / DED')}${textArea('description','Description','')}`));}

  async function openDB(){if(!('indexedDB' in window))throw Error('This browser does not support IndexedDB');if(!dbPromise){dbPromise=new Promise((resolve,reject)=>{let req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{let store=req.result.createObjectStore('docs',{keyPath:'id'});store.createIndex('projectId','projectId',{unique:false});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);}).catch(e=>{dbPromise=null;throw e});}return dbPromise;}
  async function allDocs(){let db=await openDB();return new Promise((resolve,reject)=>{let t=db.transaction('docs','readonly');let req=t.objectStore('docs').getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
  async function docsFor(pid){let db=await openDB();return new Promise((resolve,reject)=>{let t=db.transaction('docs','readonly');let req=t.objectStore('docs').index('projectId').getAll(pid);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
  async function putDoc(doc){let db=await openDB();return new Promise((resolve,reject)=>{let t=db.transaction('docs','readwrite');t.objectStore('docs').put(doc);t.oncomplete=resolve;t.onerror=()=>reject(t.error);});}
  async function delDoc(did){let db=await openDB();return new Promise((resolve,reject)=>{let t=db.transaction('docs','readwrite');t.objectStore('docs').delete(did);t.oncomplete=resolve;t.onerror=()=>reject(t.error);});}
  async function clearDocs(){let db=await openDB();return new Promise((resolve,reject)=>{let t=db.transaction('docs','readwrite');t.objectStore('docs').clear();t.oncomplete=resolve;t.onerror=()=>reject(t.error);});}
  async function refreshDocs(){let host=document.getElementById('documentList');if(!host)return;try{let docs=await docsFor(view.pid);if(!document.getElementById('documentList'))return;host.innerHTML=docs.length?docs.sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(d=>`<div class="doc"><div class="file-icon">${d.url?'🔗':'📄'}</div><div class="doc-main"><div class="doc-title">${esc(d.name)}</div><div class="small muted">${esc(d.category||'File')} · ${d.url?'Web reference':Math.ceil((d.size||0)/1024)+' KB'}</div>${d.description?`<div class="small muted">${esc(d.description)}</div>`:''}<div class="actions" style="margin-top:7px"><button class="button tiny ghost" data-action="open-doc" data-id="${d.id}">${d.url?'Open link':'Open / save'}</button><button class="button tiny danger" data-action="delete-doc" data-id="${d.id}">Delete</button></div></div></div>`).join(''):`<div class="empty">No project documents yet.</div>`;}catch(err){host.innerHTML=`<div class="notice warn">File storage is unavailable: ${esc(err.message)}</div>`;}}
  async function documentPicked(files){if(!files.length||!view.pid)return;let success=0;for(let f of files){if(f.size>20*1024*1024){alert(`${f.name} is larger than 20 MB. Please link to it instead.`);continue}try{await putDoc({id:id(),projectId:view.pid,name:f.name,type:f.type,category:'Attachment',description:'',size:f.size,blob:f,createdAt:new Date().toISOString()});success++;}catch(err){alert('Could not save '+f.name+': '+err.message);}}if(success)await refreshDocs();}
  async function openDoc(did){let d=(await allDocs()).find(x=>x.id===did);if(!d)return;if(d.url){window.open(d.url,'_blank','noopener');return}if(!d.blob){alert('This attachment is missing its content.');return}let url=URL.createObjectURL(d.blob);let a=document.createElement('a');a.href=url;a.download=d.name||'attachment';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
  function readAsDataUrl(blob){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(blob);});}
  function blobFromDataURL(str){let parts=String(str).split(',');if(parts.length<2)throw Error('Invalid file content');let bytes=atob(parts[1]),array=new Uint8Array(bytes.length);for(let i=0;i<bytes.length;i++)array[i]=bytes.charCodeAt(i);return new Blob([array],{type:(parts[0].match(/^data:([^;]*)/i)||[])[1]||'application/octet-stream'});}

  function parseCsv(raw){raw=String(raw).replace(/^\uFEFF/,'');let rows=[],row=[],cell='',quoted=false;for(let i=0;i<raw.length;i++){let c=raw[i];if(quoted){if(c==='"'&&raw[i+1]==='"'){cell+='"';i++;}else if(c==='"')quoted=false;else cell+=c;}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&raw[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell='';}else cell+=c;}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows;}
  function parseCost(v){let str=String(v??'').replace(/[₱,\s]/g,'').toUpperCase();if(!str)return null;let m=str.match(/^([\d.]+)(M|K)?$/);if(!m)return null;let value=Number(m[1])*(m[2]==='M'?1e6:m[2]==='K'?1e3:1);return Number.isFinite(value)?value:null;}
  function duration(v){let m=String(v||'').match(/\d+/);return m?Number(m[0]):null;}

  function aiDate(iso){
    if(!/^\d{4}-\d\d-\d\d$/.test(String(iso||'')))return null;

  }
  function aiDaysBetween(from,to){const a=aiDate(from),b=aiDate(to);return a&&b?Math.round((b-a)/86400000):null;}
  function aiCoverageDate(u){
    if(!u)return null;
    // CSV monthly reports represent a MONTH, not an update entered on its first day.
    // Date coverage ends at month end (or today for the current month).
    if(u.source==='csv'&&/^\d{4}-\d\d$/.test(String(u.sourceMonth||''))){
      let [yr,mo]=u.sourceMonth.split('-').map(Number);
      let lastDay=new Date(yr,mo,0);
      let last=[lastDay.getFullYear(),String(lastDay.getMonth()+1).padStart(2,'0'),String(lastDay.getDate()).padStart(2,'0')].join('-');

  }
  function aiCoverageRow(title,done,total,subtitle){let value=total?Math.round(done/total*100):0;return `<div class="ai-coverage"><div class="flex between"><b>${esc(title)}</b><span class="kbd"><b>${done}/${total}</b> · ${value}%</span></div>${progressMarkup(value)}<div class="small muted">${esc(subtitle)}</div></div>`;}
  function aiAdvisor(projects,issues){
    const sevCounts=Object.keys(AI_SEVERITY).reduce((m,k)=>(m[k]=issues.filter(x=>x.severity===k).length,m),{});
    const filtered=issues.filter(x=>(view.aiSeverity==='All'||x.severity===view.aiSeverity)&&(view.aiCategory==='All'||x.category===view.aiCategory));
    const criticalProjects=new Set(issues.filter(x=>['Critical','High'].includes(x.severity)).map(x=>x.id)).size;
    return `<div class="grid ai-stats">${aiMetric(sevCounts.Critical,'Critical flags','Check first')}${aiMetric(sevCounts.High,'High flags','Early follow-up recommended')}${aiMetric(sevCounts.Watch,'Watch items','Check for emerging issues')}${aiMetric(criticalProjects,'Priority projects',`${projects.length} projects in scope`)}</div>
      <div class="panel"><h3>How to use the advisor</h3><p class="helper">Flags are generated from documented dates, status, paid amounts, targets and quantities. Recommendations are <b>not official inspection findings</b>. Review project source documents and decide what to change. The advisor never saves or changes a record.</p></div>
      <div class="ai-findings-controls"><div><label class="caps" for="aiSeverity">Priority</label><select class="filter" id="aiSeverity">${['All','Critical','High','Watch','Info'].map(x=>`<option ${view.aiSeverity===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label class="caps" for="aiCategory">Category</label><select class="filter" id="aiCategory">${['All','Delivery','Schedule','Finance','Evidence'].map(x=>`<option ${view.aiCategory===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
      <div class="section-title"><h3>Prioritized recommendations</h3><span class="small muted">Showing ${filtered.length} of ${issues.length}</span></div>
      ${filtered.length?filtered.map((item,i)=>`<div class="panel ai-issue"><div class="flex between" style="gap:8px;align-items:flex-start"><div class="grow"><div class="flex" style="gap:6px;flex-wrap:wrap">${aiTag(item.severity)}<span class="chip">${esc(item.category)}</span></div><h3 style="margin-top:9px">${esc(item.title)}</h3></div><span class="small muted">#${i+1}</span></div>
        <button class="ai-project-link" data-action="detail" data-id="${esc(item.id)}">${esc(item.projectTitle)}</button><div class="ai-evidence"><span class="caps">Evidence</span><p>${esc(item.evidence)}</p></div><div class="ai-advice"><span class="caps">Suggested next action</span><p>${esc(item.advice)}</p></div>
        <div class="actions"><button class="button tiny primary" data-action="ai-fix" data-id="${esc(item.id)}" data-kind="${esc(item.action)}">${item.action==='quantities'?'Open quantities':item.action==='edit'?'Edit profile':item.action==='log'?'Record update':'View project'}</button><button class="button tiny ghost" data-action="detail" data-id="${esc(item.id)}">View Project 201</button></div></div>`).join(''):`<div class="empty"><h3>No matching issues</h3><p>${issues.length?'Try showing all categories or priorities.':'No issues were flagged from the available project records. This is not a certification of completion or compliance.'}</p></div>`}
      <div class="panel"><h3>Rule thresholds</h3><p class="helper">An update is flagged after ${AI_STALE_DAYS} days without recorded reporting; schedule screening compares physical progress to elapsed time if the gap reaches ${AI_LAG_POINTS} percentage points; financial-to-physical differences are highlighted from ${AI_FINANCIAL_GAP} percentage points. Monthly CSV reports use month coverage rather than assuming an update occurred on the first day. Data gaps appear as Watch or Info, not invented zeros.</p></div>`;
  }
  function aiExportReport(){
    const projects=aiScopeProjects(),issues=aiFindings(projects);
    const measured=projects.map(p=>physical(p.id)).filter(x=>x!==null);
    const avg=measured.length?(measured.reduce((a,b)=>a+b,0)/measured.length).toFixed(1)+'%':'Not measured';
    const lines=[`METRO ORMOC SLAUGHTERHOUSE — LOCAL PROJECT ANALYSIS`,`MOS Project Monitor v${VERSION} | Generated ${today()}`,'','BASIS: Deterministic local rules; not a generative AI or official inspection.','No records were modified.','','OVERVIEW',`Projects: ${projects.length}`,`Average physical completion: ${avg} (${measured.length}/${projects.length} measured)`,`Critical alerts: ${issues.filter(x=>x.severity==='Critical').length}`,`High alerts: ${issues.filter(x=>x.severity==='High').length}`,`Watch alerts: ${issues.filter(x=>x.severity==='Watch').length}`,'','PRIORITIZED FINDINGS'];
    for(const [i,x] of issues.entries())lines.push('',`${i+1}. [${x.severity}] ${x.projectTitle} — ${x.title}`,`Category: ${x.category}`,`Evidence: ${x.evidence.replace(/<[^>]*>/g,'')}`,`Recommended follow-up: ${x.advice}`);
    if(!issues.length)lines.push('No flags for the current selection; verify against project documents.');
    lines.push('','THRESHOLDS',`Stale reporting: >${AI_STALE_DAYS} days. Schedule variance: >=${AI_LAG_POINTS} points. Disbursement vs physical: >=${AI_FINANCIAL_GAP} points.`);
    download(`MOS-Local-AI-Analysis-${today()}.txt`,lines.join('\n'),'text/plain;charset=utf-8');
  }


  document.addEventListener('click',async ev=>{let el=ev.target.closest('[data-action]');if(!el)return;let a=el.dataset.action, pid=el.dataset.id;try{
    if(a==='navigate')go(el.dataset.page);else if(a==='ai-tab'){view.aiTab=el.dataset.tab;render();}else if(a==='ai-project'){view.aiScope=pid;view.aiTab='analyst';go('ai');}else if(a==='ai-fix'){if(el.dataset.kind==='edit')projectModal(pid);else if(el.dataset.kind==='log')updateModal(null,pid);else if(el.dataset.kind==='quantities'){view.detailTab='progress';go('detail',pid);}else{view.detailTab='overview';go('detail',pid);}}else if(a==='export-ai-report')aiExportReport();else if(a==='detail'){view.detailTab='overview';go('detail',pid);}else if(a==='detail-tab'){view.detailTab=el.dataset.tab;render();}
    else if(a==='new-project')projectModal();else if(a==='edit-project')projectModal(pid);else if(a==='delete-project'){let p=project(pid);if(p&&confirm(`Delete ${p.title} and its project file, all updates, quantities, and attachments from this iPhone? Export a backup first.`)){let docs=await docsFor(pid);for(let d of docs)await delDoc(d.id);data.projects=data.projects.filter(x=>x.id!==pid);data.updates=data.updates.filter(x=>x.projectId!==pid);data.activities=data.activities.filter(x=>x.projectId!==pid);save();go('projects');}}
    else if(a==='new-update')updateModal(null,pid);else if(a==='edit-update')updateModal(pid);
    else if(a==='delete-update'){if(confirm('Delete this journal entry?')){data.updates=data.updates.filter(u=>u.id!==pid);save();render();}}
    else if(a==='new-activity')activityModal(null,pid);else if(a==='edit-activity')activityModal(pid);
    else if(a==='delete-activity'){if(confirm('Delete this measured work item?')){data.activities=data.activities.filter(x=>x.id!==pid);save();render();}}
    else if(a==='choose-csv')document.getElementById('csvFileInput').click();else if(a==='choose-restore')document.getElementById('restoreInput').click();
    else if(a==='attach-file'){view.pid=pid;document.getElementById('documentInput').click();}else if(a==='new-link')urlModal(pid);
    else if(a==='open-doc')await openDoc(pid);else if(a==='delete-doc'){if(confirm('Delete this local document/reference?')){await delDoc(pid);refreshDocs();}}
    else if(a==='export-backup')await backupExport();else if(a==='export-summary')exportSummary();else if(a==='export-dossier')exportDossier(pid);
    else if(a==='close-modal')modalClose();else if(a==='erase-all'){if(confirm('Delete ALL project text, quantities and attachments stored in this browser? Export a backup first.')){if(confirm('Final confirmation: this cannot be undone without a backup.')){await clearDocs();data=blankData();save();go('dashboard');}}}
  }catch(err){alert('Action unsuccessful: '+err.message);}});
  document.addEventListener('submit',async ev=>{let form=ev.target.closest('form[data-form]');if(!form)return;ev.preventDefault();let x=Object.fromEntries(new FormData(form));try{
    if(form.dataset.form==='project'){if(!x.title?.trim())throw Error('Project title is required');let pid=x.id||id(), old=project(pid);let p={...(old||{}),id:pid,title:x.title.trim(),location:x.location.trim(),implementingOffice:x.implementingOffice.trim(),endUser:x.endUser.trim(),fundingSource:x.fundingSource.trim(),contractor:x.contractor.trim(),focalPerson:x.focalPerson.trim(),referenceNo:x.referenceNo.trim(),status:x.status,priority:x.priority,approvedBudget:asAmount(x.approvedBudget),amountSpent:asAmount(x.amountSpent),durationDays:asAmount(x.durationDays),startDate:x.startDate,targetDate:x.targetDate,remarks:x.remarks.trim(),statusSuggested:false,createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};if(p.startDate&&p.targetDate&&p.targetDate<p.startDate)throw Error('Target date must not precede start date');if(old)Object.assign(old,p);else data.projects.push(p);save();view.detailTab='overview';view.pid=pid;view.page='detail';}
    else if(form.dataset.form==='update'){if(!x.note?.trim())throw Error('Write the status report first');let u=data.updates.find(o=>o.id===x.id),changedDate=u&&u.date!==x.date;let result={id:u?.id||id(),projectId:x.projectId,date:x.date,period:!changedDate?u?.period||'':'',source:u?.source||'manual',sourceMonth:u?.sourceMonth||'',note:x.note.trim(),stage:x.stage,nextAction:x.nextAction.trim(),responsible:x.responsible.trim(),createdAt:u?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};if(u)Object.assign(u,result);else data.updates.push(result);let p=project(x.projectId);if(p&&projectUpdates(x.projectId).every(t=>t.date<=x.date)){p.status=x.stage;p.statusSuggested=false;}save();}
    else if(form.dataset.form==='activity'){let target=Number(x.target),actual=Number(x.actual),weight=Number(x.weight);if(!x.name?.trim()||!(target>0)||!(weight>0)||actual<0||!Number.isFinite(actual))throw Error('Enter a name, positive target/weight, and a valid actual quantity');let a=data.activities.find(o=>o.id===x.id),r={id:a?.id||id(),projectId:x.projectId,name:x.name.trim(),target,actual,unit:x.unit.trim(),weight,notes:x.notes.trim(),updatedAt:new Date().toISOString()};if(a)Object.assign(a,r);else data.activities.push(r);save();}
    else if(form.dataset.form==='link'){let u=new URL(x.url);if(!['https:','http:'].includes(u.protocol))throw Error('Only web document URLs are allowed.');await putDoc({id:id(),projectId:x.projectId,name:x.name.trim(),url:u.href,category:x.category,description:x.description.trim(),size:0,createdAt:new Date().toISOString()});}
    modalClose();render();
  }catch(err){alert('Could not save: '+err.message);}});
  document.addEventListener('input',ev=>{if(ev.target.id==='projectSearch'){view.query=ev.target.value;document.getElementById('projectList').innerHTML=projectsList();}});
  document.addEventListener('change',ev=>{let el=ev.target;if(el.id==='projectStatusFilter'){view.statusFilter=el.value;document.getElementById('projectList').innerHTML=projectsList();}else if(el.id==='updatesProjectFilter'){view.updatesFilter=el.value;render();}else if(el.id==='aiScope'){view.aiScope=el.value;render();}else if(el.id==='aiSeverity'){view.aiSeverity=el.value;render();}else if(el.id==='aiCategory'){view.aiCategory=el.value;render();}});
  document.getElementById('csvFileInput').addEventListener('change',async ev=>{await importCsvFile(ev.target.files[0]);ev.target.value='';});
  document.getElementById('restoreInput').addEventListener('change',async ev=>{await backupRestore(ev.target.files[0]);ev.target.value='';});
  document.getElementById('documentInput').addEventListener('change',async ev=>{await documentPicked([...ev.target.files]);ev.target.value='';});
  document.getElementById('modalMount').addEventListener('click',ev=>{if(ev.target.classList.contains('modal-wrap'))modalClose();});
  render();
  </script>
